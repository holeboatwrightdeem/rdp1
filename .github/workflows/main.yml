name: RDP

on:
workflow_dispatch:

jobs:
secure-rdp:
runs-on: windows-latest
timeout-minutes: 360

steps:
  \- name: Configure Core RDP Settings
    shell: pwsh
    run: |
      Set-ItemProperty \`
        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' \`
        -Name 'fDenyTSConnections' \`
        -Value 0 \`
        -Force

      Set-ItemProperty \`
        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' \`
        -Name 'UserAuthentication' \`
        -Value 0 \`
        -Force

      Set-ItemProperty \`
        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' \`
        -Name 'SecurityLayer' \`
        -Value 0 \`
        -Force

      netsh advfirewall firewall delete rule name="RDP-Tailscale"

      netsh advfirewall firewall add rule \`
        name="RDP-Tailscale" \`
        dir=in \`
        action=allow \`
        protocol=TCP \`
        localport=3389 \`
        remoteip=100.64.0.0/10

      Restart-Service -Name TermService -Force

  \- name: Create RDP User
    shell: pwsh
    run: |
      $charSet = @{
          Upper   = [char[]]\(65..90)
          Lower   = [char[]]\(97..122)
          Number  = [char[]]\(48..57)
          Special = [char[]]'!@#$%&\*+-=?'
      }

      $rawPassword = @()
      $rawPassword += $charSet.Upper | Get-Random -Count 4
      $rawPassword += $charSet.Lower | Get-Random -Count 4
      $rawPassword += $charSet.Number | Get-Random -Count 4
      $rawPassword += $charSet.Special | Get-Random -Count 4

      $password = -join ($rawPassword | Sort-Object { Get-Random })
      $securePass = ConvertTo-SecureString $password -AsPlainText -Force

      New-LocalUser \`
        -Name 'RDP' \`
        -Password $securePass \`
        -AccountNeverExpires \`
        -PasswordNeverExpires

      Add-LocalGroupMember \`
        -Group 'Administrators' \`
        -Member 'RDP'

      Add-LocalGroupMember \`
        -Group 'Remote Desktop Users' \`
        -Member 'RDP'

      "RDP\_PASSWORD=$password" | Out-File \`
        -FilePath $env\:GITHUB\_ENV \`
        -Encoding utf8 \`
        -Append

  \- name: Install OpenCode Desktop
    shell: pwsh
    run: |
      $url = '[https://github.com/anomalyco/opencode/releases/download/v1.18.15/opencode-desktop-win-x64.exe](https://github.com/anomalyco/opencode/releases/download/v1.18.15/opencode-desktop-win-x64.exe)'
      $installer = Join-Path $env\:TEMP 'opencode-desktop-win-x64.exe'
      $expectedHash = '091C6A1678002469EC9912130E4AC346851D318E46D3F2F565C3AC09AB581F87'

      Invoke-WebRequest \`
        -Uri $url \`
        -OutFile $installer \`
        -UseBasicParsing

      $actualHash = (Get-FileHash \`
        -Path $installer \`
        -Algorithm SHA256).Hash

      if ($actualHash -ne $expectedHash) {
          Remove-Item $installer -Force
          throw "OpenCode checksum mismatch. Expected: $expectedHash, received: $actualHash"
      }

      $process = Start-Process \`
        -FilePath $installer \`
        -ArgumentList '/S', '/allusers' \`
        -Wait \`
        -PassThru

      if ($process.ExitCode -ne 0) {
          throw "OpenCode installation failed with exit code $($process.ExitCode)"
      }

      Remove-Item $installer -Force

      Write-Host 'OpenCode Desktop installed successfully.'

  \- name: Install Tailscale
    shell: pwsh
    run: |
      $tsUrl = '[https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi](https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi)'
      $installerPath = Join-Path $env\:TEMP 'tailscale.msi'

      Invoke-WebRequest \`
        -Uri $tsUrl \`
        -OutFile $installerPath \`
        -UseBasicParsing

      $process = Start-Process \`
        -FilePath 'msiexec.exe' \`
        -ArgumentList '/i', "\`"$installerPath\`"", '/quiet', '/norestart' \`
        -Wait \`
        -PassThru

      if ($process.ExitCode -ne 0) {
          throw "Tailscale installation failed with exit code $($process.ExitCode)"
      }

      Remove-Item $installerPath -Force

  \- name: Establish Tailscale Connection
    shell: pwsh
    env:
      TAILSCALE\_AUTH\_KEY: ${{ secrets.TAILSCALE\_AUTH\_KEY }}
    run: |
      $tailscale = "$env\:ProgramFiles\Tailscale\tailscale.exe"

      & $tailscale up \`
        \--authkey="$env\:TAILSCALE\_AUTH\_KEY" \`
        \--hostname="gh-runner-$env\:GITHUB\_RUN\_ID"

      if ($LASTEXITCODE -ne 0) {
          throw 'Tailscale connection failed.'
      }

      $tsIP = $null

      for ($retry = 0; $retry -lt 10; $retry++) {
          $tsIP = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if ($tsIP) {
              break
          }

          Start-Sleep -Seconds 5
      }

      if (-not $tsIP) {
          throw 'Tailscale IP was not assigned.'
      }

      "TAILSCALE\_IP=$tsIP" | Out-File \`
        -FilePath $env\:GITHUB\_ENV \`
        -Encoding utf8 \`
        -Append

  \- name: Verify RDP Accessibility
    shell: pwsh
    run: |
      Write-Host "Tailscale IP: $env\:TAILSCALE\_IP"

      $testResult = Test-NetConnection \`
        -ComputerName $env\:TAILSCALE\_IP \`
        -Port 3389 \`
        -WarningAction SilentlyContinue

      if (-not $testResult.TcpTestSucceeded) {
          throw 'TCP connection to RDP port 3389 failed.'
      }

      Write-Host 'TCP connectivity successful.'

  \- name: Maintain Connection
    shell: pwsh
    run: |
      Write-Host ''
      Write-Host '=== RDP ACCESS ==='
      Write-Host "Address:  $env\:TAILSCALE\_IP"
      Write-Host 'Username: RDP'
      Write-Host "Password: $env\:RDP\_PASSWORD"
      Write-Host '=================='
      Write-Host ''

      while ($true) {
          Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH\:mm\:ss')] RDP Active"
          Start-Sleep -Seconds 300
      }
